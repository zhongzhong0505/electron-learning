<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
  <title>System Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🖥️ System Monitor</h1>
    <div class="grid">
      <div class="card">
        <h2>CPU</h2>
        <div class="gauge">
          <div class="gauge-fill" id="cpu-fill"></div>
          <span class="gauge-text" id="cpu-text">0%</span>
        </div>
        <p class="info" id="cpu-info">Loading...</p>
      </div>
      <div class="card">
        <h2>Memory</h2>
        <div class="gauge">
          <div class="gauge-fill" id="mem-fill"></div>
          <span class="gauge-text" id="mem-text">0%</span>
        </div>
        <p class="info" id="mem-info">Loading...</p>
      </div>
      <div class="card wide">
        <h2>System Info</h2>
        <div id="sys-info" class="sys-info"></div>
      </div>
      <div class="card wide">
        <h2>CPU History (last 60s)</h2>
        <div class="chart" id="cpu-chart"></div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
