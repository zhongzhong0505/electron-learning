<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>Desktop Capturer & Net</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📸 Desktop Capturer & Net Module</h1>

    <div class="section">
      <h2>Screen/Window Sources</h2>
      <button id="refresh-sources">Refresh Sources</button>
      <div id="sources-grid" class="sources-grid"></div>
    </div>

    <div class="section">
      <h2>Screenshot</h2>
      <p class="hint">Click a source above to capture a screenshot</p>
      <div id="screenshot-container" class="screenshot-container"></div>
    </div>

    <div class="section">
      <h2>net.fetch (System Proxy Aware)</h2>
      <div class="fetch-row">
        <input id="fetch-url" type="text" value="https://httpbin.org/get" placeholder="URL..." />
        <button id="fetch-btn">Fetch</button>
      </div>
      <pre id="fetch-result" class="fetch-result"></pre>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
