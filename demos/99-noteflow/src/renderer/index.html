<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>NoteFlow</title>
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 class="app-title">📝 NoteFlow</h1>
        <button id="new-note-btn" class="btn-icon" title="New Note">+</button>
      </div>
      <div class="search-box">
        <input id="search-input" type="text" placeholder="Search notes..." />
      </div>
      <div class="sidebar-stats" id="stats"></div>
      <div class="note-list" id="note-list"></div>
      <div class="sidebar-footer">
        <button id="settings-btn" class="btn-text">⚙️ Settings</button>
        <button id="theme-btn" class="btn-text" title="Toggle Theme">🌙</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <div id="empty-state" class="empty-state">
        <h2>Select a note or create a new one</h2>
        <p>Press Ctrl+N to create a new note</p>
      </div>
      <div id="editor-view" class="editor-view" style="display:none">
        <div class="editor-toolbar">
          <input id="note-title" type="text" class="title-input" placeholder="Note title..." />
          <div class="toolbar-actions">
            <button id="pin-btn" class="btn-icon" title="Pin">📌</button>
            <button id="tag-btn" class="btn-icon" title="Tags">🏷️</button>
            <button id="export-btn" class="btn-icon" title="Export">📤</button>
            <button id="delete-btn" class="btn-icon danger" title="Delete">🗑️</button>
          </div>
        </div>
        <div class="editor-body">
          <textarea id="note-editor" class="note-editor" placeholder="Start writing..." spellcheck="false"></textarea>
          <div id="note-preview" class="note-preview"></div>
        </div>
        <div class="editor-status">
          <span id="status-saved">Saved</span>
          <span id="status-chars">0 chars</span>
          <span id="status-words">0 words</span>
        </div>
      </div>
    </main>

    <!-- Tag Picker Modal -->
    <div id="tag-modal" class="modal" style="display:none">
      <div class="modal-content">
        <h3>Manage Tags</h3>
        <div id="tag-list" class="tag-list"></div>
        <div class="tag-add-row">
          <input id="new-tag-input" type="text" placeholder="New tag name..." />
          <button id="add-tag-btn" class="btn-primary">Add</button>
        </div>
        <button id="close-tag-modal" class="btn-text">Close</button>
      </div>
    </div>
  </div>
  <script src="types/index.js"></script>
  <script src="store.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/note-list.js"></script>
  <script src="pages/editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
