<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><title>Native Interactions</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; padding: 24px; background: #fafafa; }
    h1 { margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h3 { font-size: 0.95rem; margin-bottom: 12px; color: #444; }
    button { padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { background: #5a6fd6; }
    .drop-zone { border: 2px dashed #ccc; border-radius: 8px; padding: 30px; text-align: center; color: #888; transition: all 0.2s; margin-top: 8px; }
    .drop-zone.over { border-color: #667eea; background: #f0f2ff; color: #667eea; }
    .file-info { margin-top: 10px; font-size: 12px; background: #f5f5f5; padding: 10px; border-radius: 6px; word-break: break-all; }
    .hint { font-size: 12px; color: #999; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>🔌 Native Interactions</h1>
  <div class="grid">
    <div class="card">
      <h3>📢 Notifications</h3>
      <button onclick="window.electronAPI.notify('Hello!', 'This is a system notification from Electron')">Send Notification</button>
    </div>
    <div class="card">
      <h3>⌨️ Global Shortcut</h3>
      <p class="hint">Press <b>Ctrl+Shift+H</b> (or Cmd+Shift+H) to toggle window visibility — works even when app is not focused!</p>
    </div>
    <div class="card">
      <h3>🔗 Shell Integration</h3>
      <button onclick="window.electronAPI.openExternal('https://electronjs.org')">Open electronjs.org</button>
      <p class="hint">Opens in default browser</p>
    </div>
    <div class="card">
      <h3>🖱️ Context Menu</h3>
      <div style="padding:16px; background:#f5f5f5; border-radius:6px; text-align:center; cursor:context-menu;" oncontextmenu="event.preventDefault(); window.electronAPI.showContextMenu()">
        Right-click here for custom menu
      </div>
    </div>
    <div class="card" style="grid-column: span 2;">
      <h3>📎 Drag & Drop Files</h3>
      <div class="drop-zone" id="drop-zone">Drop files here</div>
      <div id="dropped-info"></div>
    </div>
  </div>
  <script>
    const dropZone = document.getElementById('drop-zone');
    const droppedInfo = document.getElementById('dropped-info');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
    dropZone.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropZone.classList.remove('over');
      const files = Array.from(e.dataTransfer.files);
      if (files.length > 0) {
        const file = files[0];
        const info = await window.electronAPI.readFile(file.path);
        droppedInfo.innerHTML = '<div class="file-info"><b>' + info.name + '</b><br/>Size: ' + (info.size/1024).toFixed(1) + ' KB<br/>Path: ' + info.path + '<br/><br/>Preview:<br/><pre>' + info.content.substring(0, 300) + '</pre></div>';
      }
    });
  </script>
</body>
</html>
